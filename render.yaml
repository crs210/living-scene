services:
  - type: web
    name: living-scene
    runtime: node
    plan: free          # no cost; sleeps after 15 minutes without visitors. Change to starter for an always-on instance.
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=optional && npm test
    startCommand: node server.js
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST_KEY
        generateValue: true
      - key: MAX_API_CALLS
        value: "500"
