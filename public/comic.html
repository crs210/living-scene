<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living Scene (comic)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #e9dcc0; overflow: hidden; font-family: 'Patrick Hand', 'Segoe Print', 'Comic Sans MS', sans-serif; color: #15111c; }
  #q { font-family: 'Bangers', 'Impact', sans-serif !important; font-weight: 400 !important; letter-spacing: .06em; font-size: 2.9vh !important; }
  /* the picture takes everything to the left of the answers list */
  :root { --side: 24vw; }
  body.nofeed, body.bare, body.code { --side: 0px; }
  canvas { position: fixed; left: 0; top: 0; width: calc(100% - var(--side)); height: 100%; display: block; }
  .chrome { position: fixed; transition: opacity .5s; }
  body.bare .chrome { opacity: 0 !important; pointer-events: none; }
  #q { top: 4.5vh; left: 4.5vw; max-width: 46vw; font: 700 2.3vh/1.25 inherit; font-family: inherit; background: #f6c544; border: .45vh solid #15111c; padding: 1vh 1.6vh; box-shadow: .6vh .6vh 0 #15111c; transform: rotate(-1deg); }
  #join { bottom: 5vh; left: 4.5vw; display: flex; gap: 1.2vh; align-items: center; font: 700 1.7vh/1.3 inherit; font-family: inherit; background: #fbf6e9; border: .45vh solid #15111c; padding: 1vh; box-shadow: .6vh .6vh 0 #15111c; }
  #join img { width: 9.5vh; height: 9.5vh; display: block; }
  #join small { display: block; font-weight: 400; }
  /* the answers: a plain list in its own column, newest first; a row turns green once it is in the picture */
  /* the answers: speech bubbles stacked in their own column beside the picture, newest at the top;
     dashed while waiting, solid green once the director has worked them into the picture */
  #side { top: 0; right: 0; bottom: 0; width: var(--side); display: flex; flex-direction: column; overflow: hidden; padding: 4.5vh 1.8vw 3vh 0; box-sizing: border-box; }
  body.nofeed #side, body.bare #side, body.code #side { display: none; }
  #side h2 { margin: 0 0 1.6vh; padding: .8vh 1.4vh; font: 400 2.4vh 'Bangers', 'Impact', sans-serif; letter-spacing: .06em; background: #f6c544; border: .45vh solid #15111c; box-shadow: .5vh .5vh 0 #15111c; transform: rotate(1deg); }
  #side h2 small { display: block; font: 400 1.45vh 'Patrick Hand', 'Segoe Print', sans-serif; letter-spacing: 0; margin-top: .2vh; }
  #feed { flex: 1; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 1.3vh; padding: .4vh 1vh 1vh .4vh; scrollbar-width: none; }
  #feed div { flex: none; background: #fbf6e9; border: .4vh dashed #15111c; border-radius: 2.2vh; padding: 1vh 1.4vh; font-size: 1.75vh; line-height: 1.3; box-shadow: .45vh .45vh 0 #15111c; position: relative; transition: background .8s; animation: in .4s cubic-bezier(.3,1.6,.6,1); }
  #feed div::after { content: ''; position: absolute; left: 2.4vh; bottom: -1.3vh; width: 1.6vh; height: 1.6vh; background: inherit; border-right: .4vh solid #15111c; border-bottom: .4vh solid #15111c; transform: rotate(45deg) skew(12deg, 12deg); }
  #feed div.in { background: #bfe9d9; border-style: solid; }
  #feed div:nth-child(n+9) { opacity: .7; } #feed div:nth-child(n+14) { opacity: .45; }
  @keyframes in { from { opacity: 0; transform: scale(.7); } }
  #code { top: 0; right: 0; bottom: 0; width: 36vw; background: rgba(21,17,28,.93); color: #e8e2d0; font: 1.35vh/1.45 ui-monospace, Consolas, monospace; padding: 2vh; overflow: auto; display: none; white-space: pre-wrap; }
  body.code #code { display: block; }
  #code h3 { font: 700 1.6vh system-ui, sans-serif; color: #f6c544; margin: 0 0 .6vh; }
  #code .el { color: #9aa3b5; } #code .new { color: #57c7c2; }
  #dev { top: 0; left: 0; bottom: 0; width: 40vw; background: rgba(21,17,28,.93); color: #e8e2d0; font: 1.3vh/1.45 ui-monospace, Consolas, monospace; padding: 2vh; overflow: auto; display: none; }
  body.dev #dev { display: block; } body.dev #q, body.dev #join { opacity: 0; }
  #dev h3 { font: 700 1.5vh system-ui, sans-serif; color: #f6c544; margin: 1.6vh 0 .5vh; letter-spacing: .04em; } #dev h3:first-child { margin-top: 0; }
  #dev .dim { color: #9aa3b5; } #dev .hot { color: #57c7c2; } #dev .bad { color: #ff8a7a; } #dev .ans { color: #e8e2d0; padding-left: 1.4vh; }
  #dev .job { border-left: .3vh solid #4a4560; padding: .2vh 0 .2vh 1vh; margin: 0 0 1vh; } #dev .job.live { border-color: #f6c544; }
  #controls { left: 50%; bottom: 4.5vh; transform: translateX(-50%); background: #fbf6e9; border: .45vh solid #15111c; box-shadow: .6vh .6vh 0 #15111c; padding: 1.4vh 2vh; display: none; font-size: 1.7vh; width: min(92vw, 120vh); }
  body.controls #controls { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 1vh 1.4vh; align-items: center; }
  #controls input[type=range] { width: 100%; accent-color: #d8372f; }
  #controls small { grid-column: 2; opacity: .7; margin-top: -1vh; } #controls small + small { grid-column: 4; }
  #controls .row { grid-column: 1 / -1; display: flex; gap: 1vh; align-items: center; flex-wrap: wrap; }
  #controls button { font: inherit; background: #f6c544; border: .3vh solid #15111c; padding: .5vh 1.2vh; cursor: pointer; }
  #controls input[type=text], #controls input[type=number] { font: inherit; padding: .4vh .8vh; border: .3vh solid #15111c; background: #fff; }
  #concepts { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 1vh; }
  #concepts:empty { display: none; }
  #controls button.concept { text-align: left; background: #fff; display: flex; flex-direction: column; gap: .3vh; font-size: 1.5vh; }
  #controls button.concept.on { background: #57c7c2; }
  #keys { bottom: .8vh; left: 50%; transform: translateX(-50%); font: 1.2vh system-ui, sans-serif; opacity: .5; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="q" class="chrome"></div>
<div id="join" class="chrome"><img id="qr" alt=""><div>Answer on your phone<small id="url"></small></div></div>
<aside id="side" class="chrome"><h2>Answers<small id="tally">waiting for the first one</small></h2><div id="feed"></div></aside>
<div id="code" class="chrome"></div>
<div id="dev" class="chrome"></div>
<div id="controls" class="chrome">
  <label for="abstraction">Abstraction</label><input id="abstraction" type="range" min="0" max="1" step="0.05" value="0.5">
  <label for="magnitude">Magnitude</label><input id="magnitude" type="range" min="0" max="1" step="0.05" value="0.5">
  <small>literal ← → dreamlike</small><small>gentle ← → bold</small>
  <label for="zoom">View</label><input id="zoom" type="range" min="0.6" max="1.6" step="0.05" value="1"><span></span><span></span>
  <small>pulled back ← → close in (the director may move it too)</small><small></small>
  <div class="row"><button id="start">Start session</button><input id="secs" type="number" value="120" min="20" style="width:9vh" aria-label="Session length in seconds"> seconds <button id="settle">Settle now</button><button id="final">Final image</button><button id="savepic">Save picture</button><button id="demo">Play demo</button></div>
  <div class="row"><button id="propose">Propose opening scenes</button><input id="ownconcept" type="text" placeholder="…or describe your own opening" style="flex:1" aria-label="Your own opening scene"><button id="own">Use mine</button></div>
  <div id="concepts"></div>
  <div class="row"><input id="question" type="text" placeholder="New question…" style="flex:1" aria-label="New question"><button id="newq">New scene from question</button></div>
</div>
<div id="keys" class="chrome">C scene code · F feed · H hide all · 1–4 example answers · R reset</div>
<script type="module" src="display/host.js"></script>
</body>
</html>
